name: Check

on:
  pull_request:
    # ready_for_review runs the check when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    # Roadmaps, debates, proposals and decisions are not build inputs.
    paths-ignore: ["docs/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**"]

# A new push cancels the older run of the same pull request. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    # Drafts are still in review. Skip them so review fixes do not use CI minutes.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Type-aware lint and the typecheck read the built declarations of workspace packages.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
